[/Script/EngineSettings.GameMapsSettings]
; Render Studio does not use levels; start on the tiny entry map so boot is fast.
EditorStartupMap=/Engine/Maps/Entry.Entry
GameDefaultMap=/Engine/Maps/Entry.Entry

[/Script/Engine.RendererSettings]
; Look-dev friendly defaults: fixed exposure, no motion blur, TAA, fully dynamic lighting.
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AntiAliasing=2
r.AllowStaticLighting=False
r.GenerateMeshDistanceFields=True
r.ReflectionCaptureResolution=256

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/BuildSettings.BuildSettings]
; Two editor-type targets exist: RenderStudioEditor (plugin development inside UE4Editor) and
; RenderStudio (the standalone application). Tools that need "the" editor target use this one.
DefaultEditorTarget=RenderStudioEditor
